name: Deploy to VPS Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: 67.211.219.87
      DEPLOY_USER: root
      DEPLOY_PATH: /home/SamantaScraper

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts

      - name: Deploy application
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST "bash -s" << 'ENDSSH'

            set -e

            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            DEPLOY_PATH=/home/SamantaScraper

            echo "=== Starting deployment ==="

            mkdir -p $DEPLOY_PATH
            cd $DEPLOY_PATH

            # First deploy
            if [ ! -d ".git" ]; then
              echo "=== Cloning repository ==="
              git clone git@github.com:LL01-Business-Dowell/new_scraper.git .
            fi

            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Writing environment variables ==="
            cat > .env << EOF
            CRUD_API_KEY=${{ secrets.CRUD_API_KEY }}
            DATABASE_ID=${{ secrets.DATABASE_ID }}
            GEMINI_KEY_1=${{ secrets.GEMINI_KEY_1 }}
            GEMINI_KEY_2=${{ secrets.GEMINI_KEY_2 }}
            GEMINI_KEY_3=${{ secrets.GEMINI_KEY_3 }}
            EOF

            echo "=== Docker login ==="
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "=== Building updated services only ==="
            docker compose build

            echo "=== Restarting containers ==="
            docker compose up -d

            echo "=== Cleaning dangling images only ==="
            docker image prune -f

            echo "=== Running containers ==="
            docker compose ps

            echo "=== Deployment complete ==="

          ENDSSH

      - name: Verify deployment
        run: |
          echo "Waiting 20 seconds for startup..."
          sleep 20

          curl -f https://reviewanalysis.uxlivinglab.org/countries \
            && echo "SUCCESS — backend is responding" \
            || (echo "FAILED — check logs" && exit 1)