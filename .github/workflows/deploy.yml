name: Deploy to VPS Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 67.211.219.87 >> ~/.ssh/known_hosts

      - name: Pull code on server
        env:
          DEPLOY_HOST: 67.211.219.87
          DEPLOY_USER: root
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST "bash -s" << 'ENDSSH'
            DEPLOY_PATH=/home/SamantaScraper
            echo "=== Starting deployment ==="

            if [ ! -d "$DEPLOY_PATH" ]; then
              mkdir -p "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"

            if [ ! -d ".git" ]; then
              echo "First deploy — cloning repo..."
              git clone git@github.com:LL01-Business-Dowell/new_scraper.git . || { echo "Clone failed"; exit 1; }
            fi

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main || { echo "Git reset failed"; exit 1; }
            echo "Code updated."
          ENDSSH

      - name: Write environment variables
        env:
          DEPLOY_HOST: 67.211.219.87
          DEPLOY_USER: root
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST "tee /home/SamantaScraper/.env > /dev/null" << EOF
          CRUD_API_KEY=${{ secrets.CRUD_API_KEY }}
          DATABASE_ID=${{ secrets.DATABASE_ID }}
          GEMINI_KEY_1=${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2=${{ secrets.GEMINI_KEY_2 }}
          GEMINI_KEY_3=${{ secrets.GEMINI_KEY_3 }}
          EOF

      - name: Docker Hub login on server
        env:
          DEPLOY_HOST: 67.211.219.87
          DEPLOY_USER: root
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST \
            "echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin"

      - name: Docker Hub login on server
        env:
          DEPLOY_HOST: 67.211.219.87
          DEPLOY_USER: root
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST \
            "echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin"

      - name: Build and start containers
        env:
          DEPLOY_HOST: 67.211.219.87
          DEPLOY_USER: root
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST "bash -s" << 'ENDSSH'
            DEPLOY_PATH=/home/SamantaScraper
            cd "$DEPLOY_PATH"

            echo "=== Building containers ==="
            docker compose up -d --build || { echo "Docker Compose failed"; exit 1; }

            echo "=== Pruning old images ==="
            docker system prune -f

            echo "=== Running containers ==="
            docker compose ps

            echo "=== Deployment complete ==="
          ENDSSH

      - name: Verify deployment
        run: |
          echo "Waiting 40 seconds for containers to start..."
          sleep 40
          curl -f https://reviewanalysis.uxlivinglab.org/countries \
            && echo "SUCCESS — backend is responding" \
            || echo "WARNING — health check failed, check server logs"