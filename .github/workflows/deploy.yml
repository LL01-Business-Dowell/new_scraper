name: Deploy to VPS Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: 67.211.219.87
      DEPLOY_USER: root
      DEPLOY_PATH: /home/SamantaScraper

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts

          # Configure SSH KeepAlive to prevent "Broken pipe" connection drops
          cat << 'EOF' >> ~/.ssh/config
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 20
            TCPKeepAlive yes
          EOF

      - name: Pull latest code
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST "bash -s" << 'ENDSSH'
            set -e
            DEPLOY_PATH=/home/SamantaScraper
            mkdir -p $DEPLOY_PATH
            cd $DEPLOY_PATH
            if [ ! -d ".git" ]; then
              echo "=== Cloning repository ==="
              git clone git@github.com:LL01-Business-Dowell/new_scraper.git .
            fi
            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main
            echo "=== Code updated ==="
          ENDSSH

      - name: Write environment variables
        # This step runs on the GitHub Actions runner, NOT inside a heredoc,
        # so ${{ secrets.* }} expands correctly before being sent to the server.
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST "cat > /home/SamantaScraper/.env" << EOF
          CRUD_API_KEY=${{ secrets.CRUD_API_KEY }}
          PURETRACE_API_KEY=${{ secrets.PURETRACE_API_KEY }}
          FEEDBACK_CRUD_API_KEY=${{ secrets.FEEDBACK_CRUD_API_KEY }}
          FEEDBACK_QR_API_KEY=${{ secrets.FEEDBACK_QR_API_KEY }}
          DATABASE_ID=${{ secrets.DATABASE_ID }}
          SESSION_DATABASE_ID=${{ secrets.SESSION_DATABASE_ID }}
          SAMANTA_DATABASE_ID=${{ secrets.SAMANTA_DATABASE_ID }}
          GEMINI_KEY_1=${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2=${{ secrets.GEMINI_KEY_2 }}
          GEMINI_KEY_3=${{ secrets.GEMINI_KEY_3 }}
          DOWELL_GEMINI_KEY=${{ secrets.DOWELL_GEMINI_KEY }}
          APIFY_API_TOKEN=${{ secrets.APIFY_API_TOKEN }}
          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          TEXT_ANALYSIS_API_URL=${{ secrets.TEXT_ANALYSIS_API_URL }}
          TEXT_ANALYSIS_METADATA_API_URL=${{ secrets.TEXT_ANALYSIS_METADATA_API_URL }}
          ZOHO_CLIENT_ID=${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET=${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN=${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ORGANIZATION_ID=${{ secrets.ZOHO_ORGANIZATION_ID }}
          EOF

      - name: Docker login on server
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST \
            "echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin"

      - name: Build and restart containers
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST "bash -s" << 'ENDSSH'
            set -e
            cd /home/SamantaScraper

            # 1. Remove dangling images and cap build cache to 2GB instead of deleting everything
            docker image prune -f || true
            docker builder prune -f --keep-storage=2GB || true
            truncate -s 0 /var/lib/docker/containers/*/*-json.log 2>/dev/null || true

            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            export BUILDKIT_PARALLEL_LIMIT=1

            # 2. Detect which service folders changed since last deploy
            CHANGED_FILES=$(git diff --name-only HEAD@{1} HEAD 2>/dev/null || echo "ALL")
            echo "Changed files: $CHANGED_FILES"

            if echo "$CHANGED_FILES" | grep -qE "^(backend/|ALL)"; then
              echo "=== Building Backend (changes detected) ==="
              docker compose build --progress=plain backend
            fi

            if echo "$CHANGED_FILES" | grep -qE "^(audio-analysis/|ALL)"; then
              echo "=== Building Audio Analysis (changes detected) ==="
              docker compose build --progress=plain audio-analysis
            fi

            if echo "$CHANGED_FILES" | grep -qE "^(frontend/|inscriber/|text-analysis/|nginx/|ALL)"; then
              echo "=== Building Remaining Changed Services ==="
              docker compose build --progress=plain inscriber text-analysis frontend nginx
            fi

            echo "=== Restarting updated containers ==="
            docker compose up -d --remove-orphans

            echo "=== Reclaiming unused images & capping cache ==="
            docker image prune -f || true
            docker builder prune -f --keep-storage=2GB || true
            docker compose ps
          ENDSSH

      - name: Verify deployment
        run: |
          echo "Waiting 20 seconds for startup..."
          sleep 20
          curl -f https://reviewanalysis.uxlivinglab.org/ \
            && echo "SUCCESS — backend is responding" \
            || (echo "FAILED — check logs" && exit 1)