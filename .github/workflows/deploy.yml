name: Deploy to VPS Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: 67.211.219.87
      DEPLOY_USER: root
      DEPLOY_PATH: /home/SamantaScraper

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts

      - name: Pull latest code
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST "bash -s" << 'ENDSSH'
            set -e
            DEPLOY_PATH=/home/SamantaScraper
            mkdir -p $DEPLOY_PATH
            cd $DEPLOY_PATH
            if [ ! -d ".git" ]; then
              echo "=== Cloning repository ==="
              git clone git@github.com:LL01-Business-Dowell/new_scraper.git .
            fi
            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main
            echo "=== Code updated ==="
          ENDSSH

      - name: Write environment variables
        # This step runs on the GitHub Actions runner, NOT inside a heredoc,
        # so ${{ secrets.* }} expands correctly before being sent to the server.
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST "cat > /home/SamantaScraper/.env" << EOF
          CRUD_API_KEY=${{ secrets.CRUD_API_KEY }}
          DATABASE_ID=${{ secrets.DATABASE_ID }}
          SAMANTA_DATABASE_ID=${{ secrets.SAMANTA_DATABASE_ID }}
          GEMINI_KEY_1=${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2=${{ secrets.GEMINI_KEY_2 }}
          GEMINI_KEY_3=${{ secrets.GEMINI_KEY_3 }}
          APIFY_API_TOKEN=${{ secrets.APIFY_API_TOKEN }}
          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          EOF

      - name: Docker login on server
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST \
            "echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin"

      - name: Build and restart containers
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST "bash -s" << 'ENDSSH'
            set -e
            cd /home/SamantaScraper

            echo "=== Enabling Single-Threaded Sequential BuildKit ==="
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            export BUILDKIT_PARALLEL_LIMIT=1

            echo "=== Pruning previous build cache to free memory ==="
            docker builder prune -f || true

            echo "=== Building Heavy Python Services Sequentially ==="
            docker compose build --parallel=false audio-analysis
            docker compose build --parallel=false backend

            echo "=== Building Remaining Services ==="
            docker compose build inscriber frontend nginx

            echo "=== Restarting containers ==="
            docker compose up -d

            echo "=== Cleaning build cache and dangling images ==="
            docker builder prune -f || true
            docker image prune -f || true

            echo "=== Running containers ==="
            docker compose ps
            echo "=== Deployment complete ==="
          ENDSSH

      - name: Verify deployment
        run: |
          echo "Waiting 20 seconds for startup..."
          sleep 20
          curl -f https://reviewanalysis.uxlivinglab.org/ \
            && echo "SUCCESS — backend is responding" \
            || (echo "FAILED — check logs" && exit 1)