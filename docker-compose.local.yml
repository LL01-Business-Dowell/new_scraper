services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - WATCHFILES_FORCE_POLLING=true
    env_file:
      - .env

  # Audio Analytics (Django) service
  audio_analysis:
    build: ./audio_analysis
    volumes:
      - ./audio_analysis:/usr/src/app
    ports:
      - "8003:8003"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      target: development # Dev stage using Vite
      args:
        VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true

  nginx:
    profiles: ["production"]