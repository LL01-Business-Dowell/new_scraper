server {
    listen 80;
    server_name reviewanalysis.uxlivinglab.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name reviewanalysis.uxlivinglab.org;

    ssl_certificate /etc/letsencrypt/live/reviewanalysis.uxlivinglab.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reviewanalysis.uxlivinglab.org/privkey.pem;

    # Allow up to 25MB audio file uploads
    client_max_body_size 25M;

    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /inscriber/ {
        proxy_pass http://inscriber:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /session/ {
        try_files $uri $uri/ /index.html;
    }
}